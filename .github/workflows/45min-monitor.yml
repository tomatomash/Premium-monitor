name: 45min-monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '*/45 * * * *'
jobs:
  run_monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      
      # 这里增加了 beautifulsoup4，解决了报错问题
      - run: pip install requests pytz beautifulsoup4
      
      - run: python monitor.py
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
