name: 高频监控 (A股交易时段)

on:
  workflow_dispatch:  # 手动触发保留
  schedule:
    # 每25分钟一次，且仅在A股交易时段（北京时间9:15-15:00）运行
    # 北京时间对应UTC时间为1:15-7:00，以下是精准的cron表达式
    - cron: '15 1 * * 1-5'  # 9:15（UTC1:15）
    - cron: '40 1 * * 1-5'  # 9:40（UTC1:40）
    - cron: '5 2 * * 1-5'   # 10:05（UTC2:05）
    - cron: '30 2 * * 1-5'  # 10:30（UTC2:30）
    - cron: '55 2 * * 1-5'  # 10:55（UTC2:55）
    - cron: '20 3 * * 1-5'  # 11:20（UTC3:20）
    - cron: '45 3 * * 1-5'  # 11:45（UTC3:45）
    - cron: '10 5 * * 1-5'  # 13:10（UTC5:10） 注：A股午间休市到13:00
    - cron: '35 5 * * 1-5'  # 13:35（UTC5:35）
    - cron: '0 6 * * 1-5'   # 14:00（UTC6:00）
    - cron: '25 6 * * 1-5'  # 14:25（UTC6:25）
    - cron: '50 6 * * 1-5'  # 14:50（UTC6:50）

jobs:
  run_monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须开启写入权限以发布网页
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: pip install requests pytz

      - name: 执行监控并生成网页
        env:
          FEISHU_URL: ${{ secrets.FEISHU_URL }}
        run: python monitor.py

      - name: 将网页部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_files: index.html
          keep_files: true  # 保护其他静态项目
