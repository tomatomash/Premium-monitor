name: 高频监控 (A股交易时段)

on:
  workflow_dispatch:
  schedule:
    # 协调世界时 (UTC) 01:00-07:00 对应北京时间 09:00-15:00
    - cron: '*/15 1-6 * * 1-5'

jobs:
  run_monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须开启写入权限以发布网页
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: pip install requests pytz

      - name: 执行监控并生成网页
        env:
          FEISHU_URL: ${{ secrets.FEISHU_URL }}
        run: python monitor.py

      - name: 将网页部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_files: index.html
          keep_files: true  # 保护其他静态项目
