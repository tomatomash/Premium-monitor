name: 低频监控 (休市时段)

on:
  workflow_dispatch:
  schedule:
    # 避开高频时段，每小时运行一次
    - cron: '0 0,7-23 * * *'

jobs:
  run_monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: pip install requests pytz

      - name: 执行监控并生成网页
        env:
          FEISHU_URL: ${{ secrets.FEISHU_URL }}
        run: python monitor.py

      - name: 将网页部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_files: index.html
          keep_files: true
# 在你的 workflow 步骤中添加以下部分
    - name: Run script
      run: |
        rm -f fund_cache.pkl  # 强制删除缓存文件，确保获取最新实时数据
        python monitor.py
