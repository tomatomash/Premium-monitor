name: 低频监控 (休市时段)
on:
  schedule:
    # 每天其余时间，每小时运行一次
    # 排除 1-6 点(UTC)，即排除 A股交易段
    - cron: '0 0,7-23 * * *'
  workflow_dispatch:

jobs:
  run_monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: 执行监控
        env:
          FEISHU_URL: ${{ secrets.FEISHU_URL }}
        run: |
          pip install requests pytz
          python monitor.py
# ...前面的步骤不变...
      - name: 执行监控并生成网页
        env:
          FEISHU_URL: ${{ secrets.FEISHU_URL }}
        run: python monitor.py

      - name: 将网页部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_files: index.html  # 只发布这一个文件，覆盖旧的
# 删掉 destination_dir: monitor 这一行
          keep_files: true        # 确保不删掉你其他的 HTML 项目
